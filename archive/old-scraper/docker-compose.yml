services:
  sqlite-data:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /data && tail -f /dev/null"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "test", "-d", "/data"]
      interval: 10s
      timeout: 3s
      retries: 3
  app:
    build: .
    depends_on:
      sqlite-data:
        condition: service_healthy
    environment:
      ENABLE_PAID_FETCH: ${ENABLE_PAID_FETCH:-false}
      THEIRSTACK_API_KEY: ${THEIRSTACK_API_KEY:-}
      THEIRSTACK_BASE_URL: ${THEIRSTACK_BASE_URL:-https://api.theirstack.com}
      JOB_SOURCE_BASE_URL: ${JOB_SOURCE_BASE_URL:-}
      JOB_SOURCE_API_KEY: ${JOB_SOURCE_API_KEY:-}
      JOB_SYNC_DB_PATH: /app/data/jobs.sqlite3
      APPLY_LLM_SKILL_PATH: ${APPLY_LLM_SKILL_PATH:-/app/skills/SKILL.md}
    volumes:
      - ./data:/app/data
      - ../skills:/app/skills:ro
    command: ["job-sync", "dry-run"]
