[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-sync"
version = "0.1.0"
description = "Credit-safe TheirStack job sync prototype"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
live = [
    "playwright>=1.45",
    "pypdf>=4.0",
]

[project.scripts]
job-sync = "sync.jobs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
db = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
