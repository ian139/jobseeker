services:
  jobs-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # Compose interpolates supported credentials/configuration from the
      # invoking shell or an optional project .env.  .env.example is
      # documentation only and must never be injected into the container.
      DATABASE_URL: ${DATABASE_URL:-data/jobs.sqlite3}
      JOB_SOURCE_BASE_URL: ${JOB_SOURCE_BASE_URL:-}
      JOB_SOURCE_API_KEY: ${JOB_SOURCE_API_KEY:-}
      THEIRSTACK_API_KEY: ${THEIRSTACK_API_KEY:-}
      THEIRSTACK_ENABLE_PAID_FETCH: ${THEIRSTACK_ENABLE_PAID_FETCH:-false}
      THEIRSTACK_BASE_URL: ${THEIRSTACK_BASE_URL:-https://api.theirstack.com}
      OMP_AUTH_BROKER_URL: ${OMP_AUTH_BROKER_URL:-}
      OMP_AUTH_BROKER_TOKEN: ${OMP_AUTH_BROKER_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY:-}
      OLLAMA_CLOUD_BASE_URL: ${OLLAMA_CLOUD_BASE_URL:-https://ollama.com}
      OLLAMA_CLOUD_MODEL: ${OLLAMA_CLOUD_MODEL:-deepseek-v4-flash}
      OLLAMA_CLOUD_THINK: ${OLLAMA_CLOUD_THINK:-low}
      # Docker Desktop blocks Chromium's sandbox in this container-only profile.
      # The adapter forwards this narrowed flag only from /.dockerenv.
      JOBS_ASSISTANT_CONTAINER_NO_SANDBOX: "1"
      HOME: /home/app
      XDG_CONFIG_HOME: /home/app/.config
      XDG_CACHE_HOME: /home/app/.cache
    tmpfs:
      - /home/app:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0700
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./resume
        target: /app/resume
        read_only: true
        bind:
          create_host_path: false
    command: ["--help"]
