[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobs-assistant"
version = "0.1.0"
description = "Minimal local job backlog ingestion and safe autofill assistant"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
live = []

[project.scripts]
jobs-assistant = "jobs_assistant.cli:main"
job-scrape = "jobs_assistant.cli:job_scrape_main"
resume-generate = "jobs_assistant.resume_command:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobs_assistant = ["puppeteer_runner.js", "safety_policy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
